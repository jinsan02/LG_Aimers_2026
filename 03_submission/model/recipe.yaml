default_stage:
  default_modifiers:
    AWQModifier:
      targets: [Linear]
      ignore: [embed_tokens, lm_head]
      scheme: W4A16_ASYM
      mappings:
      - smooth_layer: re:.*v_proj$
        balance_layers: ['re:.*o_proj$']
      - smooth_layer: re:.*up_proj$
        balance_layers: ['re:.*down_proj$']
      duo_scaling: true
      n_grid: 20
